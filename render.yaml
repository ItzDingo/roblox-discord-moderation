services:
  - type: web
    name: roblox-moderation-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roblox-moderation-db
          property: connectionString
      - key: PORT
        value: "10000"
      - key: API_SECRET
        sync: false
      - key: ROBLOX_UNIVERSE_ID
        sync: false
      - key: ROBLOX_OPEN_CLOUD_API_KEY
        sync: false
      - key: ROBLOX_MESSAGE_TOPIC
        value: ModerationCommand_v1

  - type: worker
    name: roblox-moderation-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run start:bot
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roblox-moderation-db
          property: connectionString
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: MOD_CHANNEL_ID
        sync: false
      - key: ALLOWED_ROLE_IDS
        sync: false
      - key: ROBLOX_UNIVERSE_ID
        sync: false
      - key: ROBLOX_OPEN_CLOUD_API_KEY
        sync: false
      - key: ROBLOX_MESSAGE_TOPIC
        value: ModerationCommand_v1

databases:
  - name: roblox-moderation-db
    databaseName: moderation
    user: moderation
    plan: free
